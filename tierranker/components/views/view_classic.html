<div class="classic-controls">
    <h3>Classic Tier List Editor</h3>
    <div class="results-actions">
        <button id="btn-classic-randomize" class="btn btn-secondary">Randomize</button>
        <button id="btn-classic-unrank-all" class="btn btn-secondary">Unrank All Items</button>
        <button id="btn-classic-toggle-unranked" class="btn btn-secondary">Hide Unranked Pool</button>
        <button id="btn-classic-copy-image" class="btn btn-secondary">Copy</button>
        <button id="btn-classic-export-image" class="btn btn-secondary">Export</button>
        <div class="size-controls">
            <span>Size:</span>
            <button id="btn-classic-size-decrease" class="btn-adjust">-</button>
            <button id="btn-classic-size-increase" class="btn-adjust">+</button>
        </div>
        <button id="btn-classic-back-to-results" class="btn btn-secondary">Back to Results</button>
        <button id="btn-classic-back-to-staging" class="btn btn-secondary">Back to Staging</button>
    </div>
</div>
<div id="classic-tier-list-export-area">
    <div id="classic-tier-list-grid"></div>
    <div id="classic-unranked-pool-container">
        <h4>Unranked Items</h4>
        <p>Drag items from here to a tier above.</p>
        <div id="classic-unranked-pool">
        </div>
    </div>
</div>
