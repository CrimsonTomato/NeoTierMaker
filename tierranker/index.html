<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TierRanker</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Self-executing script for theme loading remains directly in the template
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    })();
  </script>
</head>

<body>
  <div id="root-container">
    <div class="app-container" id="app-container">
      <%- injectLeftSidebar %>
        <main class="center-stage">
          <!-- Center stage content is composed in vite.config.js and injected here -->
          <%- injectCenterStage %>
        </main>
        <div id="sidebar-resizer" class="sidebar-resizer"></div>
        <%- injectRightSidebar %>
    </div>
  </div>
  <!-- Hidden elements (inputs) injected here -->
  <%- injectHiddenElements %>
    <script type="module" src="js/main.js"></script>
    <!-- Global image preview (remains here as it's a floating UI element, not part of a specific component block) -->
    <div id="global-image-preview" class="image-preview-tooltip"></div>
    <!-- Modal injected here -->
    <%- injectModal %>
</body>

</html>
